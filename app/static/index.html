<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="app">
        <section id="auth-section" class="auth-card">
            <h1>Task Manager</h1>
            <p class="subtitle">FastAPI + JWT Task Manager</p>

            <div class="tabs">
                <button id="login-tab" class="tab active">Login</button>
                <button id="register-tab" class="tab">Register</button>
            </div>

            <form id="auth-form">
                <label>Email</label>
                <input id="email" type="email" placeholder="you@example.com" required>

                <label>Password</label>
                <input id="password" type="password" placeholder="Password" required>

                <button id="auth-submit" type="submit">Login</button>
                <p id="auth-message" class="message"></p>
            </form>
        </section>

        <section id="dashboard" class="dashboard hidden">
            <header class="topbar">
                <div>
                    <h1>Task Manager</h1>
                    <span id="user-email"></span>
                </div>
                <button id="logout-btn" class="secondary">Logout</button>
            </header>

            <div class="stats">
                <div class="stat-card"><span>Total</span><strong id="total-count">0</strong></div>
                <div class="stat-card"><span>Completed</span><strong id="completed-count">0</strong></div>
                <div class="stat-card"><span>Pending</span><strong id="pending-count">0</strong></div>
            </div>

            <div class="task-form-card">
                <h2 id="form-title">Add Task</h2>
                <form id="task-form">
                    <input id="task-id" type="hidden">
                    <label>Title</label>
                    <input id="task-title" type="text" placeholder="Learn FastAPI" required>
                    <label>Description</label>
                    <textarea id="task-description" placeholder="Task description"></textarea>
                    <div class="form-actions">
                        <button type="submit" id="save-task-btn">Create Task</button>
                        <button type="button" id="cancel-edit-btn" class="secondary hidden">Cancel</button>
                    </div>
                    <p id="task-message" class="message"></p>
                </form>
            </div>

            <div class="tasks-card">
                <div class="tasks-heading">
                    <h2>My Tasks</h2>
                    <button id="refresh-btn" class="secondary">Refresh</button>
                </div>
                <div id="tasks-list"></div>
            </div>
        </section>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
